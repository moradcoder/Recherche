<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master Research Lab — Méthodologie de recherche scientifique</title>
<style>
/* ============ RESET & VARIABLES ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f6fb; --bg-card:#ffffff; --bg-alt:#eef2f9;
  --text:#1e2433; --text-muted:#5c677d; --border:#dde3ee;
  --primary:#3b5bdb; --primary-dark:#2f49b0; --primary-soft:#e4e9fd;
  --success:#1f9d55; --success-soft:#e3f6ec;
  --danger:#d64545; --danger-soft:#fde8e8;
  --warning:#c98a00; --warning-soft:#fff4d6;
  --radius:14px; --radius-sm:9px;
  --shadow:0 2px 8px rgba(20,30,60,.07);
  --shadow-lg:0 8px 28px rgba(20,30,60,.13);
  --font:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --font-ar:'Segoe UI','Tahoma',system-ui,sans-serif;
}
html[data-theme="dark"]{
  --bg:#12161f; --bg-card:#1a2030; --bg-alt:#212a3d;
  --text:#e6eaf3; --text-muted:#9aa7bf; --border:#2c3750;
  --primary:#6d8bff; --primary-dark:#8aa2ff; --primary-soft:#232f52;
  --success:#4ade80; --success-soft:#173227;
  --danger:#f87171; --danger-soft:#3a1d1d;
  --warning:#fbbf24; --warning-soft:#3a2f13;
  --shadow:0 2px 8px rgba(0,0,0,.35);
  --shadow-lg:0 8px 28px rgba(0,0,0,.5);
}
html[dir="rtl"]{--font:'Segoe UI','Tahoma',system-ui,sans-serif}
body{
  font-family:var(--font);background:var(--bg);color:var(--text);
  line-height:1.6;min-height:100vh;transition:background .25s,color .25s;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}
a{color:var(--primary)}
/* ============ LAYOUT ============ */
.app{max-width:1180px;margin:0 auto;padding:0 16px 80px}
header.top{
  position:sticky;top:0;z-index:50;background:var(--bg);
  border-bottom:1px solid var(--border);backdrop-filter:blur(8px);
  background:color-mix(in srgb,var(--bg) 88%,transparent);
}
.top-inner{
  max-width:1180px;margin:0 auto;padding:12px 16px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem}
.brand .logo{
  width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--primary),#7c3aed);
  display:grid;place-items:center;color:#fff;font-size:1.15rem;flex:none;
}
.brand small{display:block;font-weight:400;font-size:.7rem;color:var(--text-muted)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.icon-btn{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--border);
  background:var(--bg-card);display:grid;place-items:center;font-size:1.05rem;
  transition:.2s;color:var(--text)
}
.icon-btn:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-1px)}
.lang-select{
  border:1px solid var(--border);background:var(--bg-card);color:var(--text);
  border-radius:10px;padding:8px 10px;font-size:.85rem;font-weight:600;
}
/* nav tabs */
nav.tabs{
  display:flex;gap:4px;overflow-x:auto;padding:0 16px 10px;max-width:1180px;
  margin:0 auto;scrollbar-width:none;
}
nav.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:none;padding:8px 14px;border-radius:999px;font-size:.85rem;font-weight:600;
  color:var(--text-muted);white-space:nowrap;transition:.2s;border:1px solid transparent
}
.tab:hover{background:var(--bg-alt);color:var(--text)}
.tab.active{background:var(--primary);color:#fff;box-shadow:var(--shadow)}
/* ============ COMMON ============ */
h1{font-size:1.75rem;line-height:1.25;letter-spacing:-.02em}
h2{font-size:1.3rem;line-height:1.3;margin-bottom:6px;letter-spacing:-.01em}
h3{font-size:1.05rem;line-height:1.35;margin-bottom:4px}
.sub{color:var(--text-muted);font-size:.92rem}
.section{margin-top:26px}
.card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 20px;box-shadow:var(--shadow);transition:border-color .2s,box-shadow .2s;
}
.card.hoverable:hover{border-color:color-mix(in srgb,var(--primary) 45%,var(--border));box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.grid{display:grid;gap:14px}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.badge{
  display:inline-block;padding:3px 9px;border-radius:999px;font-size:.72rem;font-weight:700;
  background:var(--primary-soft);color:var(--primary);letter-spacing:.02em
}
.badge.green{background:var(--success-soft);color:var(--success)}
.badge.orange{background:var(--warning-soft);color:var(--warning)}
.badge.red{background:var(--danger-soft);color:var(--danger)}
.badge.gray{background:var(--bg-alt);color:var(--text-muted)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 18px;border-radius:var(--radius-sm);font-weight:600;font-size:.9rem;
  background:var(--primary);color:#fff;transition:.2s;border:1px solid transparent
}
.btn:hover{background:var(--primary-dark);transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.secondary{background:var(--bg-alt);color:var(--text);border-color:var(--border)}
.btn.secondary:hover{background:var(--primary-soft);color:var(--primary);border-color:var(--primary)}
.btn.danger{background:var(--danger)}
.btn.danger:hover{background:#b53a3a}
.btn.small{padding:6px 12px;font-size:.8rem}
.btn.ghost{background:transparent;color:var(--text-muted);border:1px solid var(--border)}
.btn.ghost:hover{color:var(--primary);border-color:var(--primary);background:var(--primary-soft)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
hr.sep{border:none;border-top:1px solid var(--border);margin:16px 0}
/* progress */
.progress{height:9px;background:var(--bg-alt);border-radius:999px;overflow:hidden}
.progress > span{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#7c3aed);border-radius:999px;transition:width .5s ease}
.progress.green > span{background:linear-gradient(90deg,#22c55e,#16a34a)}
/* ============ DASHBOARD ============ */
.hero{
  background:linear-gradient(135deg,var(--primary),#6d3aed);color:#fff;
  border-radius:var(--radius);padding:30px 26px;margin-top:20px;position:relative;overflow:hidden
}
.hero::after{
  content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;
  background:rgba(255,255,255,.12)
}
.hero h1{color:#fff;position:relative;z-index:1}
.hero p{color:rgba(255,255,255,.9);margin-top:6px;position:relative;z-index:1;max-width:640px}
.hero .row{margin-top:16px;position:relative;z-index:1}
.hero .btn{background:#fff;color:var(--primary)}
.hero .btn:hover{background:#eef2ff;color:var(--primary-dark)}
.stat-card{text-align:center;padding:16px 10px}
.stat-card .num{font-size:1.7rem;font-weight:800;color:var(--primary);line-height:1.1}
.stat-card .lbl{font-size:.78rem;color:var(--text-muted);margin-top:4px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
/* ============ LESSONS ============ */
.lesson-body{font-size:.95rem}
.lesson-body p{margin-bottom:10px}
.lesson-body ul,.lesson-body ol{margin:8px 0 12px 20px}
.lesson-body li{margin-bottom:5px}
.idea{
  background:var(--primary-soft);border-left:4px solid var(--primary);
  padding:12px 16px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;margin:14px 0;font-size:.92rem
}
.warn{
  background:var(--warning-soft);border-left:4px solid var(--warning);
  padding:12px 16px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;margin:14px 0;font-size:.92rem
}
.example{
  background:var(--bg-alt);border-left:4px solid var(--text-muted);
  padding:12px 16px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;margin:14px 0;font-size:.92rem
}
/* tables */
.tbl-wrap{overflow-x:auto;margin:12px 0}
table{width:100%;border-collapse:collapse;font-size:.87rem;min-width:420px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
th{background:var(--bg-alt);font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.03em;color:var(--text-muted)}
tr:last-child td{border-bottom:none}
/* ============ QUIZ ============ */
.quiz-header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.quiz-meta{font-size:.82rem;color:var(--text-muted);font-weight:600}
.q-card{padding:20px}
.q-text{font-size:1.02rem;font-weight:600;margin:6px 0 16px;line-height:1.5}
.q-src{font-size:.74rem;color:var(--text-muted);font-weight:600}
.q-options{display:grid;gap:9px}
.opt{
  display:flex;align-items:flex-start;gap:11px;padding:12px 15px;border:1.5px solid var(--border);
  border-radius:var(--radius-sm);cursor:pointer;transition:.18s;font-size:.92rem;text-align:left;width:100%;
  background:var(--bg-card);color:var(--text)
}
.opt:hover:not(.disabled){border-color:var(--primary);background:var(--primary-soft)}
.opt .letter{
  flex:none;width:26px;height:26px;border-radius:50%;background:var(--bg-alt);
  display:grid;place-items:center;font-weight:800;font-size:.8rem;color:var(--text-muted)
}
.opt.selected{border-color:var(--primary);background:var(--primary-soft)}
.opt.selected .letter{background:var(--primary);color:#fff}
.opt.correct{border-color:var(--success);background:var(--success-soft)}
.opt.correct .letter{background:var(--success);color:#fff}
.opt.wrong{border-color:var(--danger);background:var(--danger-soft)}
.opt.wrong .letter{background:var(--danger);color:#fff}
.opt.disabled{cursor:default}
.opt .mark{margin-left:auto;font-weight:800;flex:none}
.explanation{
  margin-top:14px;padding:14px 16px;border-radius:var(--radius-sm);
  background:var(--bg-alt);border:1px solid var(--border);font-size:.88rem;line-height:1.55
}
.explanation strong{color:var(--primary)}
.quiz-nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
/* result */
.result-big{text-align:center;padding:26px 16px}
.score-ring{font-size:2.6rem;font-weight:800;line-height:1}
/* ============ FLASHCARDS ============ */
.fc-stage{perspective:1200px;max-width:560px;margin:0 auto}
.flashcard{
  width:100%;min-height:220px;position:relative;transform-style:preserve-3d;
  transition:transform .55s cubic-bezier(.4,.2,.2,1);cursor:pointer
}
.flashcard.flipped{transform:rotateY(180deg)}
.fc-face{
  position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius);
  padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;border:1px solid var(--border);box-shadow:var(--shadow);overflow-y:auto
}
.fc-front{background:var(--bg-card)}
.fc-back{background:var(--primary-soft);transform:rotateY(180deg)}
.fc-face .fc-label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:10px}
.fc-face .fc-content{font-size:1.02rem;font-weight:600;line-height:1.5}
.fc-back .fc-content{font-weight:400;font-size:.92rem}
/* ============ MATCH GAME ============ */
.match-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match-col h4{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:8px}
.match-item{
  padding:11px 13px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  margin-bottom:8px;cursor:pointer;transition:.18s;font-size:.88rem;background:var(--bg-card)
}
.match-item:hover{border-color:var(--primary)}
.match-item.selected{border-color:var(--primary);background:var(--primary-soft)}
.match-item.matched{border-color:var(--success);background:var(--success-soft);opacity:.65;pointer-events:none}
.match-item.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
/* ============ ORDER GAME ============ */
.order-item{
  padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  margin-bottom:8px;display:flex;align-items:center;gap:10px;background:var(--bg-card);font-size:.9rem
}
.order-item .idx{width:26px;height:26px;border-radius:50%;background:var(--bg-alt);display:grid;place-items:center;font-weight:800;font-size:.8rem;flex:none;color:var(--text-muted)}
.order-item .moves{margin-left:auto;display:flex;gap:4px}
.order-item .moves button{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);font-size:.9rem;display:grid;place-items:center}
.order-item .moves button:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
.order-item.ok{border-color:var(--success);background:var(--success-soft)}
.order-item.bad{border-color:var(--danger);background:var(--danger-soft)}
/* ============ GLOSSARY ============ */
.gloss-item{padding:14px 16px;border-bottom:1px solid var(--border)}
.gloss-item:last-child{border-bottom:none}
.gloss-term{font-weight:700;font-size:1rem;color:var(--primary)}
.gloss-def{font-size:.9rem;margin-top:5px}
.gloss-ar{font-size:.85rem;color:var(--text-muted);margin-top:5px;direction:rtl;text-align:right}
.alpha-bar{display:flex;gap:4px;flex-wrap:wrap;margin:12px 0}
.alpha-bar button{
  width:30px;height:30px;border-radius:7px;border:1px solid var(--border);
  font-size:.78rem;font-weight:700;background:var(--bg-card);color:var(--text-muted)
}
.alpha-bar button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
/* ============ SEARCH ============ */
.search-box{position:relative;width:100%;max-width:420px}
.search-box input{
  width:100%;padding:11px 16px 11px 40px;border-radius:999px;border:1px solid var(--border);
  background:var(--bg-card);color:var(--text);font-size:.9rem;outline:none;transition:.2s
}
.search-box input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.search-box .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:.95rem}
html[dir="rtl"] .search-box input{padding:11px 40px 11px 16px}
html[dir="rtl"] .search-box .ico{left:auto;right:14px}
/* ============ MISC ============ */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.filters select{
  padding:8px 12px;border-radius:9px;border:1px solid var(--border);
  background:var(--bg-card);color:var(--text);font-size:.84rem;font-weight:600;outline:none
}
.filters select:focus{border-color:var(--primary)}
.empty{text-align:center;padding:36px 16px;color:var(--text-muted);font-size:.92rem}
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(120px);
  background:var(--text);color:var(--bg);padding:12px 22px;border-radius:999px;
  font-size:.88rem;font-weight:600;z-index:200;transition:transform .35s cubic-bezier(.2,.8,.2,1);
  box-shadow:var(--shadow-lg);max-width:90vw;text-align:center;pointer-events:none
}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--success);color:#fff}
.toast.err{background:var(--danger);color:#fff}
details.faq{border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;margin-bottom:8px;background:var(--bg-card)}
details.faq summary{cursor:pointer;font-weight:600;font-size:.92rem;list-style:none}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::before{content:'▸ ';color:var(--primary);font-weight:800}
details.faq[open] summary::before{content:'▾ '}
details.faq p{margin-top:8px;font-size:.88rem;color:var(--text-muted)}
.list-num{counter-reset:item;list-style:none}
.list-num li{counter-increment:item;display:flex;gap:10px;margin-bottom:7px;font-size:.9rem}
.list-num li::before{
  content:counter(item);flex:none;width:22px;height:22px;border-radius:50%;
  background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;
  font-weight:800;font-size:.72rem
}
.kpi{display:flex;align-items:center;gap:9px;font-size:.85rem;color:var(--text-muted);font-weight:600}
.kpi .dot{width:9px;height:9px;border-radius:50%;background:var(--primary)}
.stepper{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:10px 0}
.step-dot{width:10px;height:10px;border-radius:50%;background:var(--border)}
.step-dot.done{background:var(--success)}
.step-dot.cur{background:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.view{display:none}
.view.active{display:block;animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media (max-width:640px){
  h1{font-size:1.4rem}
  .hero{padding:22px 18px}
  .card{padding:15px 15px}
  .match-cols{grid-template-columns:1fr}
  .top-inner{padding:10px 12px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div class="logo">🎓</div>
      <div>Master Research Lab
        <small id="brandSub">Comprendre, mémoriser et réussir la méthodologie</small>
      </div>
    </div>
    <div class="top-actions">
      <select class="lang-select" id="langSelect" aria-label="Langue">
        <option value="fr">🇫🇷 Français</option>
        <option value="ar">🇸🇦 العربية</option>
        <option value="dr">🇲🇦 الدارجة</option>
      </select>
      <button class="icon-btn" id="themeBtn" title="Mode sombre/clair" aria-label="Changer de thème">🌙</button>
      <button class="icon-btn" id="resetBtn" title="Réinitialiser la progression" aria-label="Réinitialiser">↺</button>
    </div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main class="app" id="app"></main>

<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   DONNÉES PÉDAGOGIQUES — extraites du PDF (76 pages)
   ========================================================================= */
const COURSE = {
  title: "Méthodologie de recherche scientifique",
  subtitle: "Recherche documentaire, bibliométrie, rédaction scientifique, publication et mémoire/PFE",
  author: "Aissam Hadri — FSAO – Ouarzazate",
  year: "2026"
};

/* ---------- CHAPITRES / RÉSUMÉS ---------- */
const CHAPTERS = [
  {
    id: "c1", num: 1, title: "Recherche documentaire et littérature scientifique",
    pages: "4–13",
    summary: "La littérature scientifique regroupe les publications communiquant des résultats de recherche et des connaissances validées : articles originaux, revues de synthèse, actes de conférences, thèses, livres, prépublications. Un travail scientifique sérieux commence par comprendre le contexte scientifique dans lequel la question s'inscrit, identifier les lacunes de recherche, appuyer les arguments par des références fiables et éviter de refaire un travail déjà publié.",
    ideas: [
      "La littérature scientifique = publications communiquant des résultats validés.",
      "Types : article original, revue de synthèse, actes de conférence, thèse/mémoire, livre, prépublication.",
      "Chercher la littérature permet de connaître l'existant et d'identifier ce qui reste à étudier.",
      "On ne commence pas par écrire : on commence par comprendre le contexte scientifique.",
      "Critères d'évaluation d'une source : pertinence, qualité scientifique, actualité, crédibilité, impact, cohérence.",
      "Une source ne doit pas être acceptée seulement parce qu'elle apparaît dans Google : elle doit être lue, comprise et évaluée."
    ],
    definitions: [
      ["Littérature scientifique", "Ensemble des publications qui communiquent des résultats de recherche et des connaissances validées."],
      ["Lacune de recherche", "Limite, question ouverte ou hypothèse non vérifiée identifiée dans la littérature existante."],
      ["Prépublication", "Version d'un article déposée avant ou pendant l'évaluation par les pairs (ex. arXiv)."],
      ["Revue de synthèse", "Document qui résume et organise plusieurs travaux sur un thème donné."],
      ["Article original", "Article présentant une contribution nouvelle avec méthode, résultats et discussion."]
    ],
    keywords: ["littérature scientifique", "article original", "revue de synthèse", "prépublication", "lacune de recherche", "état de l'art"],
    steps: ["Chercher", "Sélectionner", "Évaluer", "Lire", "Citer", "Rédiger"],
    mistakes: [
      "Commencer à écrire immédiatement sans comprendre le contexte.",
      "Accepter une source uniquement parce qu'elle apparaît dans Google.",
      "Ignorer les articles récents qui contredisent ou limitent la contribution.",
      "Utiliser des références trop anciennes dans un domaine qui évolue vite."
    ],
    example: "Avant de proposer une nouvelle méthode de classification, il faut connaître les méthodes de référence, les jeux de données utilisés, les métriques d'évaluation et les limites rapportées dans les articles récents."
  },
  {

/* =========================================================================
   ÉTAT & STOCKAGE
   ========================================================================= */
const STORE_KEY = "mrl_state_v1";
const defaultState = () => ({
  lang: "fr",
  theme: "light",
  history: [],          // {qid, correct, chosen, date}
  errors: [],           // qid uniques
  favorites: [],        // qid
  srs: {},              // qid -> {level, nextReview}
  lastResults: [],      // {label, score, total, date}
  streak: 0,
  lastAnswerDate: null
});
let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return defaultState();
    const s = JSON.parse(raw);
    return Object.assign(defaultState(), s);
  }catch(e){ return defaultState(); }
}
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}
function t(key){
  const lang = state.lang || "fr";
  return (I18N[lang] && I18N[lang][key]) || I18N.fr[key] || key;
}

/* =========================================================================
   UTILITAIRES
   ========================================================================= */
const $ = (sel, ctx=document) => ctx.querySelector(sel);
const $$ = (sel, ctx=document) => Array.from(ctx.querySelectorAll(sel));
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function qById(id){ return QUESTIONS.find(q=>q.id===id); }
function chById(id){ return CHAPTERS.find(c=>c.id===id); }
function qsForChapter(chId){ return QUESTIONS.filter(q=>q.ch===chId); }
function qsForPage(page){ return QUESTIONS.filter(q=>q.page===page); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

/* Toast */
let toastTimer;
function toast(msg, type="ok"){
  const el = $("#toast");
  el.textContent = msg;
  el.className = "toast show " + (type==="err"?"err":type==="ok"?"ok":"");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.className = "toast"; }, 2600);
}

/* Thème */
function applyTheme(){
  document.documentElement.setAttribute("data-theme", state.theme);
  $("#themeBtn").textContent = state.theme === "dark" ? "☀️" : "🌙";
}
/* Langue & direction */
function applyLang(){
  const lang = state.lang || "fr";
  document.documentElement.lang = (lang === "ar" || lang === "dr") ? "ar" : "fr";
  document.documentElement.dir = (lang === "ar" || lang === "dr") ? "rtl" : "ltr";
  $("#langSelect").value = lang;
  // Ré-afficher la vue courante
  renderTabs();
  route(location.hash || "#home");
}

/* =========================================================================
   NAVIGATION
   ========================================================================= */
const VIEWS = [
  {id:"home", icon:"🏠"},
  {id:"lessons", icon:"📘"},
  {id:"quiz", icon:"❓"},
  {id:"exams", icon:"📝"},
  {id:"flashcards", icon:"🗂️"},
  {id:"games", icon:"🎮"},
  {id:"glossary", icon:"📖"},
  {id:"errors", icon:"🔁"},
  {id:"stats", icon:"📊"},
  {id:"express", icon:"⚡"}
];

function renderTabs(){
  const nav = $("#tabs");
  const current = (location.hash || "#home").replace("#","").split("?")[0].split("/")[0];
  nav.innerHTML = VIEWS.map(v => {
    const label = t("tabs")[v.id] || v.id;
    const active = current === v.id ? " active" : "";
    return `<button class="tab${active}" data-nav="${v.id}">${v.icon} ${esc(label)}</button>`;
  }).join("");
  $$("[data-nav]", nav).forEach(b => b.addEventListener("click", ()=>{ location.hash = "#"+b.dataset.nav; }));
}

function route(hash){
  const app = $("#app");
  const raw = (hash||"#home").replace("#","");
  const parts = raw.split("/");
  const view = parts[0] || "home";
  const param = parts[1] || null;
  // Sécurité : vue inconnue -> home
  const known = VIEWS.some(v=>v.id===view);
  if(!known){ location.hash = "#home"; return; }
  window.scrollTo({top:0,behavior:"instant"});
  renderTabs();
  switch(view){
    case "home": renderHome(app); break;
    case "lessons": renderLessons(app, param); break;
    case "quiz": renderQuizHub(app, param); break;
    case "exams": renderExams(app); break;
    case "flashcards": renderFlashcards(app); break;
    case "games": renderGames(app, param); break;
    case "glossary": renderGlossary(app); break;
    case "errors": renderErrors(app); break;
    case "stats": renderStats(app); break;
    case "express": renderExpress(app); break;
  }
}

/* =========================================================================
   MOTEUR DE QUIZ
   ========================================================================= */
let QUIZ = null;

function startQuiz(chapterId, ids, label){
  let questions;
  if(chapterId) questions = qsForChapter(chapterId);
  else if(ids) questions = ids.map(qById).filter(Boolean);
  else questions = QUESTIONS.slice();

  if(questions.length===0){ toast(t("noQuestions"),"err"); return; }

  const sourceLabel = label || (chapterId ? (t("chapterPrefix")+" "+chById(chapterId).num) : t("quizAll"));

  QUIZ = {
    questions: shuffle(questions),
    idx: 0,
    answers: {},          // qid -> chosen index
    validated: {},        // qid -> true
    label: sourceLabel,
    chapterId: chapterId || null,
    timer: null,
    timeLeft: 0,
    finished: false
  };
  renderQuizView();
}

function renderQuizView(){
  const app = $("#app");
  if(!QUIZ){ renderQuizHub(app); return; }
  if(QUIZ.finished){ renderQuizResult(app); return; }

  const q = QUIZ.questions[QUIZ.idx];
  const chosen = QUIZ.answers[q.id];
  const validated = QUIZ.validated[q.id];
  const total = QUIZ.questions.length;

  app.innerHTML = `
  <section class="section">
    <div class="quiz-header">
      <div>
        <button class="btn ghost small" data-quit>← ${esc(t("backToQuiz"))}</button>
        <h2 style="margin-top:6px">${esc(QUIZ.label)}</h2>
      </div>
      <div class="quiz-meta">${esc(t("question"))} ${QUIZ.idx+1} ${esc(t("of"))} ${total}</div>
    </div>

    <div class="progress" style="margin-bottom:16px"><span style="width:${((QUIZ.idx)/total*100).toFixed(1)}%"></span></div>

    <div class="card q-card">
      <div class="row" style="justify-content:space-between">
        <span class="q-src">${esc(t("sourcePage"))} ${q.page} · ${esc(t("chapterPrefix"))} ${chById(q.ch).num}</span>
        <span class="badge ${q.diff==='facile'?'green':q.diff==='difficile'?'red':'orange'}">${esc(t(q.diff))}</span>
      </div>
      <p class="q-text">${esc(q.q)}</p>
      <div class="q-options" id="opts">
        ${q.opts.map((opt,i)=>{
          let cls = "opt";
          if(validated){
            cls += " disabled";
            if(i===q.ans) cls += " correct";
            else if(i===chosen) cls += " wrong";
          } else if(chosen===i){ cls += " selected"; }
          return `<button class="${cls}" data-opt="${i}" ${validated?'disabled':''}>
            <span class="letter">${"ABCD"[i]}</span>
            <span>${esc(opt)}</span>
            ${validated && i===q.ans ? '<span class="mark" style="color:var(--success)">✓</span>' : ''}
            ${validated && i===chosen && i!==q.ans ? '<span class="mark" style="color:var(--danger)">✗</span>' : ''}
          </button>`;
        }).join("")}
      </div>

      ${validated ? `
        <div class="explanation">
          <strong>${chosen===q.ans ? esc(t("correct")) : esc(t("wrong"))}</strong><br>
          ${chosen!==q.ans ? `<em>${esc(t("correctAnswerIs"))} : ${"ABCD"[q.ans]}.</em><br>` : ''}
          ${esc(q.exp)}
        </div>
      ` : ''}

      <div class="quiz-nav">
        <div class="row">
          <button class="btn secondary" data-prev ${QUIZ.idx===0?'disabled':''}>← ${esc(t("prev"))}</button>
          ${!validated && chosen!==undefined ? `<button class="btn" data-validate>${esc(t("validate"))}</button>` : ''}
        </div>
        <div class="row">
          ${validated ? `<button class="btn" data-next>${QUIZ.idx===total-1 ? esc(t("finish")) : esc(t("next"))} →</button>` : ''}
          <button class="btn ghost small" data-fav title="${esc(t("favorite"))}">${state.favorites.includes(q.id)?'★':'☆'}</button>
        </div>
      </div>
    </div>

    <div class="stepper" style="margin-top:14px">
      ${QUIZ.questions.map((qq,i)=>{
        const st = QUIZ.validated[qq.id] ? (QUIZ.answers[qq.id]===qq.ans ? "done" : "bad") : (i===QUIZ.idx ? "cur" : "");
        return `<span class="step-dot ${st}" title="${esc(t("question"))} ${i+1}"></span>`;
      }).join("")}
    </div>
  </section>`;

  $$("[data-quit]", app).forEach(b=>b.addEventListener("click",()=>{ QUIZ=null; location.hash="#quiz"; renderQuizHub($("#app")); }));
  $$("[data-opt]", app).forEach(b=>b.addEventListener("click",()=>{
    if(QUIZ.validated[q.id]) return;
    QUIZ.answers[q.id] = Number(b.dataset.opt);
    renderQuizView();
  }));
  $$("[data-validate]", app).forEach(b=>b.addEventListener("click",()=>{
    if(QUIZ.answers[q.id]===undefined) return toast("Choisissez une réponse.","err");
    QUIZ.validated[q.id] = true;
    recordAnswer(q, QUIZ.answers[q.id]);
    renderQuizView();
  }));
  $$("[data-prev]", app).forEach(b=>b.addEventListener("click",()=>{
    if(QUIZ.idx>0){ QUIZ.idx--; renderQuizView(); }
  }));
  $$("[data-next]", app).forEach(b=>b.addEventListener("click",()=>{
    if(QUIZ.idx<QUIZ.questions.length-1){ QUIZ.idx++; renderQuizView(); }
    else { finishQuiz(); }
  }));
  $$("[data-fav]", app).forEach(b=>b.addEventListener("click",()=>{
    const id = q.id;
    const i = state.favorites.indexOf(id);
    if(i>=0){ state.favorites.splice(i,1); toast(t("removeFavorite")); }
    else { state.favorites.push(id); toast(t("addFavorite")); }
    saveState();
    renderQuizView();
  }));
}

function recordAnswer(q, chosen){
  const correct = chosen === q.ans;
  state.history.push({qid:q.id, correct, chosen, date:new Date().toISOString()});
  if(!correct){
    if(!state.errors.includes(q.id)) state.errors.push(q.id);
    state.streak = 0;
  } else {
    state.errors = state.errors.filter(id=>id!==q.id);
    const last = state.lastAnswerDate;
    const today = todayStr();
    if(last === today) state.streak += 1;
    else state.streak = 1;
    state.lastAnswerDate = today;
  }
  // SRS simple
  const srs = state.srs[q.id] || {level:0, nextReview: todayStr()};
  if(correct){
    srs.level = Math.min(srs.level+1, 5);
    const days = [0,1,2,4,7,14][srs.level] || 14;
    const d = new Date(); d.setDate(d.getDate()+days);
    srs.nextReview = d.toISOString().slice(0,10);
  } else {
    srs.level = 0;
    srs.nextReview = todayStr();
  }
  state.srs[q.id] = srs;
  // Limiter l'historique
  if(state.history.length > 2000) state.history = state.history.slice(-1500);
  saveState();
}

function finishQuiz(){
  const total = QUIZ.questions.length;
  const correct = QUIZ.questions.filter(q=>QUIZ.answers[q.id]===q.ans).length;
  state.lastResults.push({label:QUIZ.label, score:correct, total, date:new Date().toISOString()});
  if(state.lastResults.length>50) state.lastResults = state.lastResults.slice(-40);
  saveState();
  QUIZ.finished = true;
  renderQuizResult($("#app"));
}

function renderQuizResult(app){
  const total = QUIZ.questions.length;
  const correct = QUIZ.questions.filter(q=>QUIZ.answers[q.id]===q.ans).length;
  const pct = total ? Math.round(correct/total*100) : 0;
  const wrongQs = QUIZ.questions.filter(q=>QUIZ.answers[q.id]!==q.ans);

  app.innerHTML = `
  <section class="section">
    <div class="card result-big">
      <div class="score-ring" style="color:${pct>=70?'var(--success)':pct>=40?'var(--warning)':'var(--danger)'}">${pct}%</div>
      <p class="sub" style="margin-top:6px">${esc(QUIZ.label)}</p>
      <div class="progress ${pct>=70?'green':''}" style="max-width:340px;margin:14px auto"><span style="width:${pct}%"></span></div>
      <p><strong>${correct}</strong> ${esc(t("correctAnswers"))} / ${total}</p>

      <div class="row" style="justify-content:center;margin-top:18px">
        <button class="btn" data-restart>${esc(t("restart"))}</button>
        <button class="btn secondary" data-home>${esc(t("backToQuiz"))}</button>
      </div>
    </div>

    ${wrongQs.length ? `
    <div class="card" style="margin-top:16px">
      <h2>${esc(t("errorsTitle"))} (${wrongQs.length})</h2>
      <div class="grid" style="gap:10px;margin-top:10px">
        ${wrongQs.map(q=>`
          <div class="card" style="padding:12px 14px;border-left:3px solid var(--danger)">
            <p style="font-size:.9rem;font-weight:600">${esc(q.q)}</p>
            <p class="sub" style="font-size:.8rem;margin-top:4px">${esc(t("correctAnswerIs"))} : ${"ABCD"[q.ans]} — ${esc(q.opts[q.ans])}</p>
            <p class="sub" style="font-size:.78rem;margin-top:4px">${esc(t("sourcePage"))} ${q.page}</p>
          </div>
        `).join("")}
      </div>
    </div>` : ''}
  </section>`;
  $$("[data-restart]", app).forEach(b=>b.addEventListener("click",()=>{
    if(QUIZ.chapterId) startQuiz(QUIZ.chapterId, null);
    else startQuiz(null, QUIZ.questions.map(q=>q.id), QUIZ.label);
  }));
  $$("[data-home]", app).forEach(b=>b.addEventListener("click",()=>{ QUIZ=null; location.hash="#quiz"; }));
}

/* ---- Match game ---- */
function renderMatchGame(app){
  const terms = shuffle(MATCH_PAIRS);
  const defs = shuffle(MATCH_PAIRS);
  let selectedTerm = null;
  let selectedDef = null;
  let matched = 0;

  app.innerHTML = `
  <section class="section">
    <button class="btn ghost small" data-back>← ${esc(t("backToGames"))}</button>
    <h1 style="margin-top:12px">${esc(t("matchGame"))}</h1>
    <p class="sub">${esc(t("selectTerm"))}</p>
    <div class="match-cols" style="margin-top:16px">
      <div class="match-col"><h4>Termes</h4><div id="termsCol"></div></div>
      <div class="match-col"><h4>Définitions</h4><div id="defsCol"></div></div>
    </div>
    <div class="row" style="margin-top:16px"><span class="badge green" id="matchScore">0 / ${MATCH_PAIRS.length}</span></div>
  </section>`;

  function renderCols(){
    $("#termsCol").innerHTML = terms.map((p,i)=>`<div class="match-item" data-term="${i}">${esc(p.term)}</div>`).join("");
    $("#defsCol").innerHTML = defs.map((p,i)=>`<div class="match-item" data-def="${i}">${esc(p.def)}</div>`).join("");
  }
  renderCols();

  function handleTerm(i){
    if($(`[data-term="${i}"]`).classList.contains("matched")) return;
    selectedTerm = i;
    $$("[data-term]").forEach(e=>e.classList.remove("selected"));
    $(`[data-term="${i}"]`).classList.add("selected");
  }
  function handleDef(i){
    if($(`[data-def="${i}"]`).classList.contains("matched")) return;
    if(selectedTerm===null){ toast(t("selectTerm"),"err"); return; }
    selectedDef = i;
    if(terms[selectedTerm].term === defs[selectedDef].term){
      // Bonne association
      $(`[data-term="${selectedTerm}"]`).classList.add("matched");
      $(`[data-def="${selectedDef}"]`).classList.add("matched");
      matched++;
      $("#matchScore").textContent = `${matched} / ${MATCH_PAIRS.length}`;
      selectedTerm = null; selectedDef = null;
      if(matched===MATCH_PAIRS.length) toast("Bravo ! 🎉");
    } else {
      const a = $(`[data-term="${selectedTerm}"]`);
      const b = $(`[data-def="${selectedDef}"]`);
      a.classList.add("shake"); b.classList.add("shake");
      setTimeout(()=>{ a.classList.remove("shake","selected"); b.classList.remove("shake"); }, 350);
      selectedTerm = null;
    }
  }
  function bind(){
    $$("[data-term]").forEach(e=>e.addEventListener("click",()=>handleTerm(Number(e.dataset.term))));
    $$("[data-def]").forEach(e=>e.addEventListener("click",()=>handleDef(Number(e.dataset.def))));
  }
  bind();
  $("[data-back]").addEventListener("click",()=>location.hash="#games");
}

/* ---- Timed quiz ---- */
function startTimedQuiz(){
  const pool = shuffle(QUESTIONS).slice(0,10);
  let idx = 0, score = 0, timeLeft = 90, timerId = null;
  const app = $("#app");

  function render(){
    if(idx >= pool.length){ end(); return; }
    const q = pool[idx];
    app.innerHTML = `
    <section class="section">
      <div class="spread">
        <h1>⏱️ ${esc(t("timedQuiz"))}</h1>
        <span class="badge red">${timeLeft}s</span>
      </div>
      <div class="progress" style="margin:12px 0"><span style="width:${(idx/pool.length*100)}%"></span></div>
      <div class="card q-card">
        <p class="q-src">${esc(t("question"))} ${idx+1}/${pool.length} · ${esc(t("sourcePage"))} ${q.page}</p>
        <p class="q-text">${esc(q.q)}</p>
        <div class="q-options">${q.opts.map((o,i)=>`<button class="opt" data-opt="${i}"><span class="letter">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>
      </div>
    </section>`;
    $$("[data-opt]").forEach(b=>b.addEventListener("click",()=>{
      const chosen = Number(b.dataset.opt);
      if(chosen===q.ans) score++;
      idx++;
      render();
    }));
  }
  function end(){
    clearInterval(timerId);
    app.innerHTML = `
    <section class="section">
      <div class="card result-big">
        <h1>${esc(t("challengeDone"))}</h1>
        <div class="score-ring" style="color:var(--success);margin-top:10px">${score}/${pool.length}</div>
        <div class="row" style="justify-content:center;margin-top:18px">
          <button class="btn" onclick="location.hash='#games/timed'">${esc(t("restart"))}</button>
          <button class="btn secondary" onclick="location.hash='#games'">${esc(t("backToGames"))}</button>
        </div>
      </div>
    </section>`;
  }
  render();
  timerId = setInterval(()=>{
    timeLeft--;
    if(timeLeft<=0){ clearInterval(timerId); end(); return; }
    const badge = $(".badge.red");
    if(badge) badge.textContent = timeLeft+"s";
  },1000);
}

/* ---- Final challenge ---- */
function startFinalChallenge(){
  const pool = shuffle(QUESTIONS.filter(q=>q.diff==="difficile")).slice(0,20);
  if(pool.length===0){ toast(t("noQuestions"),"err"); return; }
  startQuiz(null, pool.map(q=>q.id), t("finalChallenge"));
}

/* =========================================================================
   VUE GLOSSAIRE
   ========================================================================= */
function renderGlossary(app){
  app.innerHTML = `
  <section class="section">
    <h1>${esc(t("glossaryTitle"))}</h1>
    <p class="sub">${GLOSSARY.length} ${esc(t("termsCount"))} · ${esc(t("searchPlaceholder"))}</p>
    <div class="search-box" style="margin:14px 0">
      <span class="ico">🔍</span>
      <input type="text" id="glossSearch" placeholder="${esc(t("searchPlaceholder"))}">
    </div>
    <div class="alpha-bar" id="alphaBar"></div>
    <div class="card" id="glossList"></div>
  </section>`;

  const letters = [...new Set(GLOSSARY.map(g=>g.term[0].toUpperCase()))].sort();
  $("#alphaBar").innerHTML = `<button data-letter="">${esc(t("all"))}</button>` + letters.map(l=>`<button data-letter="${l}">${l}</button>`).join("");
  let activeLetter = "";
  let query = "";

  function renderList(){
    let list = GLOSSARY.slice();
    if(activeLetter) list = list.filter(g=>g.term[0].toUpperCase()===activeLetter);
    if(query) list = list.filter(g=>(g.term+" "+g.def).toLowerCase().includes(query.toLowerCase()));
    if(list.length===0){ $("#glossList").innerHTML = `<div class="empty">${esc(t("noResults"))}</div>`; return; }
    $("#glossList").innerHTML = list.map(g=>`
      <div class="gloss-item">
        <div class="gloss-term">${esc(g.term)}</div>
        <div class="gloss-def">${esc(g.def)}</div>
        <div class="gloss-ar">${esc(g.ar)}</div>
        <div class="row" style="margin-top:6px">
          <span class="badge gray">${esc(t("pagePrefix"))} ${g.page}</span>
          ${g.rel.map(r=>`<span class="badge">${esc(r)}</span>`).join("")}
        </div>
      </div>
    `).join("");
  }
  renderList();

  $$("#alphaBar button").forEach(b=>b.addEventListener("click",()=>{
    activeLetter = b.dataset.letter;
    $$("#alphaBar button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    renderList();
  }));
  $("#glossSearch").addEventListener("input", e=>{ query = e.target.value; renderList(); });
}

/* =========================================================================
   VUE ERREURS
   ========================================================================= */
function renderErrors(app){
  const errs = state.errors.map(qById).filter(Boolean);
  app.innerHTML = `
  <section class="section">
    <div class="spread">
      <h1>${esc(t("errorsTitle"))}</h1>
      <div class="row">
        <button class="btn small" id="reviewErrors">${esc(t("reviewErrors"))}</button>
        <button class="btn small ghost" id="clearErrors">${esc(t("clearErrors"))}</button>
      </div>
    </div>
    ${errs.length===0 ? `<div class="card" style="margin-top:16px"><div class="empty">${esc(t("noErrors"))}</div></div>` :
    `<div class="grid" style="margin-top:16px;gap:10px">
      ${errs.map(q=>`
        <div class="card" style="border-left:3px solid var(--danger)">
          <div class="spread">
            <span class="badge">${esc(t("chapterPrefix"))} ${chById(q.ch).num}</span>
            <span class="badge gray">${esc(t("pagePrefix"))} ${q.page}</span>
          </div>
          <p style="font-weight:600;margin-top:8px">${esc(q.q)}</p>
          <p class="sub" style="font-size:.84rem;margin-top:6px"><strong>${esc(t("correctAnswerIs"))} :</strong> ${"ABCD"[q.ans]} — ${esc(q.opts[q.ans])}</p>
          <p class="sub" style="font-size:.82rem;margin-top:4px">${esc(q.exp)}</p>
        </div>
      `).join("")}
    </div>`}
  </section>`;
  $("#reviewErrors")?.addEventListener("click",()=>{
    if(errs.length===0) return toast(t("noErrors"),"err");
    startQuiz(null, errs.map(q=>q.id), t("errorsTitle"));
  });
  $("#clearErrors")?.addEventListener("click",()=>{
    if(!confirm(t("confirmClear"))) return;
    state.errors = [];
    saveState();
    renderErrors(app);
    toast(t("cleared"));
  });
}

/* =========================================================================
   VUE STATS
   ========================================================================= */
function renderStats(app){
  const totalAnswered = state.history.length;
  const totalCorrect = state.history.filter(h=>h.correct).length;
  const accuracy = totalAnswered ? Math.round(totalCorrect/totalAnswered*100) : 0;
  const last = state.lastResults.slice(-5).reverse();

  app.innerHTML = `
  <section class="section">
    <h1>${esc(t("statsTitle"))}</h1>
    <p class="sub">${esc(t("loginNotNeeded"))}</p>

    <div class="grid grid-4" style="margin-top:16px">
      <div class="card stat-card"><div class="num">${totalAnswered}</div><div class="lbl">${esc(t("answered"))}</div></div>
      <div class="card stat-card"><div class="num">${totalCorrect}</div><div class="lbl">${esc(t("correctAnswers"))}</div></div>
      <div class="card stat-card"><div class="num">${accuracy}%</div><div class="lbl">${esc(t("accuracy"))}</div></div>
      <div class="card stat-card"><div class="num">${state.streak}</div><div class="lbl">${esc(t("streak"))}</div></div>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="spread">
        <h2>${esc(t("lastResults"))}</h2>
        <div class="row">
          <button class="btn small secondary" id="exportCsv">${esc(t("exportResults"))}</button>
          <button class="btn small ghost" id="exportJson">${esc(t("exportJson"))}</button>
        </div>
      </div>
      ${last.length===0 ? `<div class="empty">${esc(t("statsEmpty"))}</div>` :
      `<div class="tbl-wrap" style="margin-top:10px"><table>
        <thead><tr><th>Date</th><th>Quiz</th><th>Score</th></tr></thead>
        <tbody>${last.map(r=>`<tr><td>${esc(new Date(r.date).toLocaleDateString())}</td><td>${esc(r.label)}</td><td>${r.score}/${r.total}</td></tr>`).join("")}</tbody>
      </table></div>`}
    </div>

    <div class="card" style="margin-top:16px">
      <h2>${esc(t("favorites"))}</h2>
      ${state.favorites.length===0 ? `<div class="empty">${esc(t("noFavorites"))}</div>` :
      `<div class="grid" style="gap:8px;margin-top:10px">
        ${state.favorites.map(id=>qById(id)).filter(Boolean).map(q=>`
          <div class="card" style="padding:12px 14px">
            <p style="font-size:.9rem;font-weight:600">${esc(q.q)}</p>
            <p class="sub" style="font-size:.8rem;margin-top:4px">${esc(t("pagePrefix"))} ${q.page} · ${esc(t("chapterPrefix"))} ${chById(q.ch).num}</p>
          </div>
        `).join("")}
      </div>`}
    </div>

    <div class="card" style="margin-top:16px">
      <button class="btn danger small" id="clearAll">${esc(t("clearAll"))}</button>
    </div>
  </section>`;

  $("#exportCsv")?.addEventListener("click",()=>{
    const rows = [["date","qid","correct","chosen"]].concat(state.history.map(h=>[h.date,h.qid,h.correct,h.chosen]));
    const csv = rows.map(r=>r.join(",")).join("\n");
    downloadFile("resultats_mrl.csv", csv, "text/csv");
  });
  $("#exportJson")?.addEventListener("click",()=>{
    downloadFile("resultats_mrl.json", JSON.stringify(state, null, 2), "application/json");
  });
  $("#clearAll")?.addEventListener("click",()=>{
    if(!confirm(t("clearAllConfirm"))) return;
    state = defaultState();
    saveState();
    applyTheme(); applyLang();
    toast(t("cleared"));
  });
}
function downloadFile(name, content, mime){
  const blob = new Blob([content], {type:mime});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}

/* =========================================================================
   INITIALISATION
   ========================================================================= */
function init(){
  applyTheme();
  $("#themeBtn").addEventListener("click",()=>{
    state.theme = state.theme === "dark" ? "light" : "dark";
    saveState(); applyTheme();
  });
  $("#langSelect").addEventListener("change", e=>{
    state.lang = e.target.value;
    saveState(); applyLang();
  });
  $("#resetBtn").addEventListener("click",()=>{
    if(!confirm(t("resetConfirm"))) return;
    state = defaultState();
    saveState();
    applyTheme(); applyLang();
    toast(t("cleared"));
  });
  applyLang();
  window.addEventListener("hashchange",()=>route(location.hash));
  route(location.hash || "#home");
}
document.addEventListener("DOMContentLoaded", init);
</script>
